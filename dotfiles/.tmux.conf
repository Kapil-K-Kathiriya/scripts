# ============================================================	
# TMUX CONFIGURATION
# ============================================================
#
# PREFIX: Ctrl+A
#
# SHORTCUTS:
#
# SESSION:
#   Ctrl+A, d     Detach session
#
# WINDOW:
#   Ctrl+A, c    New window
#   Ctrl+A, n    Next window
#   Ctrl+A, p    Previous window
#   Ctrl+A, ,    Rename window
#
# PANES:
#   Ctrl+A, |    Split left/right
#   Ctrl+A, -    Split top/bottom
#   Alt+Arrow    Navigate panes
#   Ctrl+A, x    Close pane
#   Ctrl+A, z    Zoom pane
#
# RESIZE:
#   Ctrl+A, H    Resize left
#   Ctrl+A, J    Resize down
#   Ctrl+A, K    Resize up
#   Ctrl+A, L    Resize right
#
# CONFIG:
#   Ctrl+A, r    Reload config
#   Ctrl+A, ?    List key bindings
#
# ============================================================

# Prefix key
# Prefix: Ctrl + Space
unbind C-b
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Reload configuration
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# ------------------------------------------------------------
# Split panes
# ------------------------------------------------------------

bind | split-window -h
bind - split-window -v

# ------------------------------------------------------------
# Pane navigation with ALT + arrow
# ------------------------------------------------------------

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ------------------------------------------------------------
# Vim-style pane resizing
# ------------------------------------------------------------

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ------------------------------------------------------------
# Mouse support
# ------------------------------------------------------------

set -g mouse on

# ------------------------------------------------------------
# Clipboard support
# ------------------------------------------------------------

set -g set-clipboard on

# ------------------------------------------------------------
# Terminal compatibility
# ------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# ------------------------------------------------------------
# History
# ------------------------------------------------------------

set -g history-limit 100000

# ------------------------------------------------------------
# Status bar
# ------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5

set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[bold] #S "
set -g status-right "#[fg=cyan] %H:%M #[fg=white]| #[fg=green] %d-%b-%Y "

# ------------------------------------------------------------
# Pane appearance
# ------------------------------------------------------------

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

set -g display-panes-time 1000

# ------------------------------------------------------------
# Better experience
# ------------------------------------------------------------

setw -g aggressive-resize on
setw -g automatic-rename on
set -g renumber-windows on

# ------------------------------------------------------------
# Plugins
# ------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save and restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM initialization (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'

# ==============================
# Mouse support
# ==============================
set -g mouse on

# ==============================
# Wayland clipboard integration
# ==============================
set -g set-clipboard on

# Copy selection directly to system clipboard using wl-copy
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode y send-keys -X copy-pipe-and-cancel "wl-copy"

# ==============================
# Vi-style copy mode
# ==============================
setw -g mode-keys vi

# Enter copy mode with prefix + [
bind [ copy-mode

# Select text with v and copy with y
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Scroll wheel support
set -g mouse on

# ==========================================
# Default shell: Zsh
# ==========================================
set-option -g default-shell /usr/bin/zsh
set-option -g default-command "zsh"

# ==========================================
# STATUS BAR POSITION & STYLE
# ==========================================

# Move status bar to the top
set -g status-position top

# Refresh status every 2 seconds
set -g status-interval 2

# Status bar height and appearance
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Window list on the left
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#585b70]│ "

# Window list in the center
set -g window-status-format " #[fg=#a6adc8]#I:#W "
set -g window-status-current-format " #[bg=#313244,fg=#89b4fa,bold] #I:#W* "

# Right side (temporary; we'll add CPU/RAM next)
set -g status-right-length 60
set -g status-right "#[fg=#a6e3a1]● #[fg=#cdd6f4]%H:%M #[fg=#585b70]│ #[fg=#89b4fa]%d-%b-%Y "
set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# Live CPU and RAM monitor (no clock/date)
set -g status-right-length 100
set -g status-right "#[fg=#89b4fa,bold] #( ~/.local/bin/tmux-stats )"
